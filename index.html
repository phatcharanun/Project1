<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>For Students</title>
    
    <!-- เชื่อมต่อ Manifest สำหรับ PWA -->
    <link rel="manifest" href="pwa/manifest.json">
    <link rel="icon" type="image/svg+xml" href="pwa/icons/icon1.svg">
    <meta name="theme-color" content="#ffffff">
    
    <!-- นำเข้าสไตล์ CSS -->
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="qr-code-scanner/scanner.css">
</head>
<body>

    <div class="app-shell">
        <header class="app-header"><h1>For Students</h1></header>

        <main class="container">
            <div id="secure-context-warning" class="info-box" style="display: none;">
                การใช้งานกล้องและ GPS ต้องเปิดเว็บไซต์ผ่าน HTTPS หรือ localhost
            </div>

            <section class="map-section" aria-label="ตำแหน่ง GPS">
                <div class="map-frame">
                    <iframe id="location-map" title="แผนที่ตำแหน่งปัจจุบัน" loading="lazy"
                        src="https://www.openstreetmap.org/export/embed.html?bbox=100.5139%2C13.7670%2C100.5147%2C13.7675&amp;layer=mapnik&amp;marker=13.76725%2C100.51427"></iframe>
                    <div class="map-status"><span class="gps-dot"></span> GPS: <span id="geofence-status">รอระบุตำแหน่ง</span></div>
                    <button id="btn-get-location" class="map-location-button" onclick="toggleGPS()" aria-label="เปิดหรือปิด GPS" title="เปิดหรือปิด GPS">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
                    </button>
                </div>
                <div class="map-attribution">แผนที่ © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a></div>
                <div class="coordinates" aria-live="polite">
                    <span>ตำแหน่งปัจจุบัน</span>
                    <span><span id="lat-val">-</span>, <span id="lng-val">-</span></span>
                </div>
            </section>

            <section id="scan" class="scan-section" aria-labelledby="scan-title">
                <div class="scan-mark" aria-hidden="true">
                    <svg viewBox="0 0 64 64"><path d="M8 23V11a3 3 0 0 1 3-3h12M41 8h12a3 3 0 0 1 3 3v12M56 41v12a3 3 0 0 1-3 3H41M23 56H11a3 3 0 0 1-3-3V41"/></svg>
                </div>
                <h2 id="scan-title">สแกนคิวอาร์โค้ด</h2>
                <div class="video-container">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="canvas" hidden></canvas>
                </div>
                <div class="scan-actions">
                    <button id="btn-start-camera" class="scan-button" onclick="startCamera()">
                        <span>สแกนคิวอาร์โค้ด</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3m8 0h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M9 10h6v4H9z"/></svg>
                    </button>
                    <button id="btn-capture" class="capture-button" onclick="takeSnapshot()" style="display: none;">ถ่ายภาพ</button>
                </div>
                <div id="qr-result-container" role="status" aria-live="polite">
                    <div class="checkmark-circle" aria-hidden="true">✓</div>
                    <div class="qr-success-text">สแกนสำเร็จ</div>
                    <div class="qr-data-label">ข้อมูลที่อ่านได้:</div>
                    <div id="qr-data-value" class="qr-data-text"></div>
                </div>
                <div id="photo-preview"></div>
            </section>

            <section id="biometrics" class="biometrics-section" aria-labelledby="biometrics-title">
                <h2 id="biometrics-title">Biometrics</h2>
                <div class="biometric-actions">
                    <button id="btn-verify-bio" class="biometric-button" type="button" onclick="handleBiometricVerify()">
                        <span>สแกนลายนิ้วมือ</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11a2 2 0 0 0-2 2c0 3.2-.5 5.5-1.5 7M12 7a6 6 0 0 0-6 6c0 2.2-.3 4.1-1 5.8M12 3a10 10 0 0 0-10 10m10-2a2 2 0 0 1 2 2c0 2.8-.2 5.2-.8 7.2M16.8 19.6c.8-2.1 1.2-4.5 1.2-7.6a6 6 0 0 0-6-6"/></svg>
                    </button>
                    <button id="btn-scan-face" class="biometric-button biometric-button-secondary" type="button" onclick="handleFaceScan()">
                        <span>สแกนใบหน้า</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3m8 0h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M9 10h.01M15 10h.01M9 15c1.7 1.3 4.3 1.3 6 0"/></svg>
                    </button>
                </div>
                <p class="biometric-status">สถานะ: <strong id="biometric-status">พร้อมใช้งาน</strong></p>
                <details class="advanced-biometric">
                    <summary>ตัวเลือกเพิ่มเติม</summary>
                    <label class="student-id-label" for="student-id-input">รหัสนักศึกษา</label>
                    <input type="text" id="student-id-input" placeholder="กรอกรหัสนักศึกษา" autocomplete="username">
                    <button id="btn-register-bio" type="button" onclick="handleBiometricRegister()">ลงทะเบียน Biometrics</button>
                    <button id="btn-open-face-camera" type="button" onclick="startFaceCamera()">เรียกใช้ Face ID / Face Unlock</button>
                    <video id="face-video" autoplay playsinline muted></video>
                    <div id="face-result" class="info-box">สถานะ: รอการสแกนหน้า</div>
                </details>
            </section>

            <p class="risk-score">Risk Scoring: <span>รอข้อมูล</span></p>
        </main>

        <nav class="bottom-nav" aria-label="เมนูหลัก">
            <a href="#home" aria-label="หน้าหลัก" class="nav-item nav-active">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
            </a>
            <a href="#scan" aria-label="สแกน" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12a2 2 0 0 0 4 0"/></svg>
            </a>
            <a href="#biometrics" aria-label="บัญชี" class="nav-item">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            </a>
        </nav>
    </div>
    <span id="home" class="home-anchor" aria-hidden="true"></span>

    <!-- เรียกใช้งานสคริปต์ JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="qr-code-scanner/config.js"></script>
    <script src="qr-code-scanner/scanner.js"></script>
    <script src="qr-code-scanner/index.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/Geofence.js"></script>
    <script src="js/webauthn.js"></script>

    <!-- ลงทะเบียน Service Worker สำหรับ PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker ลงทะเบียนสำเร็จ:', reg.scope))
                    .catch(err => console.error('Service Worker ลงทะเบียนล้มเหลว:', err));
            });
        }
    </script>
</body>
</html>
