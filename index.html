<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Camera & Geofence App</title>
    
    <!-- เชื่อมต่อ Manifest สำหรับ PWA -->
    <link rel="manifest" href="pwa/manifest.json">
    <link rel="icon" type="image/svg+xml" href="pwa/icons/icon1.svg">
    <meta name="theme-color" content="#007bff">
    
    <!-- นำเข้าสไตล์ CSS -->
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="qr-code-scanner/scanner.css">
</head>
<body>

    <header>
        <h1>PWA Camera & GPS App</h1>
    </header>

    <main class="container">

        <div id="secure-context-warning" class="info-box" style="display: none;">
            การใช้งานกล้องและ GPS ผ่านเลข IP ต้องเปิดเว็บไซต์ด้วย HTTPS
            (หรือใช้ localhost) เพื่อให้เบราว์เซอร์อนุญาตการเข้าถึงอุปกรณ์
        </div>
        
        <!-- ส่วนที่ 1: กล้องถ่ายรูป/สแกน -->
        <section class="card">
            <h2>1. ระบบกล้อง</h2>
            <div class="video-container">
                <video id="webcam" autoplay playsinline style="width: 100%; max-width: 400px; display: none; background: #000;"></video>
                <canvas id="canvas" style="display:none;"></canvas>
            </div>
            
            <div class="button-group">
                <button id="btn-start-camera" onclick="startCamera()">เปิดกล้อง</button>
                <button id="btn-capture" onclick="takeSnapshot()" style="display: none;">ถ่ายภาพ</button>
            </div>

             <!-- UI สำหรับแสดงผลการสแกน QR Code (ซ่อนอยู่จนกว่าจะสแกนเจอ) -->
            <div id="qr-result-container" role="status" aria-live="polite">
                <div class="checkmark-circle" aria-hidden="true">✓</div>
                <div class="qr-success-text">สแกนสำเร็จ</div>
                <div class="qr-data-label">ข้อมูลที่อ่านได้:</div>
                <div id="qr-data-value" class="qr-data-text"></div>
            </div>

            <div id="photo-preview"></div>
        </section>

        <!-- ส่วนที่ 2: ตำแหน่ง GPS และ Geofence -->
        <section class="card">
            <h2>2. ระบบ GPS & Geofencing</h2>
            <div class="button-group">
                <button id="btn-get-location" onclick="toggleGPS()">เปิดใช้งาน GPS ติดตามตำแหน่ง</button>
            </div>
            
            <div class="info-box">
                <p><strong>ละติจูด (Lat):</strong> <span id="lat-val">-</span></p>
                <p><strong>ลองจิจูด (Lng):</strong> <span id="lng-val">-</span></p>
                <p><strong>สถานะ Geofence:</strong> <span id="geofence-status">ยังไม่ได้ตรวจจับ</span></p>
            </div>
        </section>

    </main>

    <!-- เรียกใช้งานสคริปต์ JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="qr-code-scanner/config.js"></script>
    <script src="qr-code-scanner/scanner.js"></script>
    <script src="qr-code-scanner/index.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/location.js"></script>
    <script src="js/geofencing.js"></script> 


    <!-- ลงทะเบียน Service Worker สำหรับ PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker ลงทะเบียนสำเร็จ:', reg.scope))
                    .catch(err => console.error('Service Worker ลงทะเบียนล้มเหลว:', err));
            });
        }
    </script>
</body>
</html>
