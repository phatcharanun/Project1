
services:
  # 1. ฐานข้อมูลหลัก + ข้อมูลเชิงพื้นที่ (PostgreSQL + PostGIS)
  postgres-postgis:
    image: postgis/postgis:15-3.3
    container_name: cams_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cams_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cams_1234}
      POSTGRES_DB: ${POSTGRES_DB:-cams_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Backend/init.sql:/docker-entrypoint-initdb.d/init.sql # รันสร้างตารางอัตโนมัติตอนเปิดครั้งแรก
      - ./Backend/migrations/001_auth.sql:/docker-entrypoint-initdb.d/zz_001_auth.sql # รันหลัง init.sql (เรียงตามชื่อไฟล์)
      - ./Backend/migrations/002_attendance.sql:/docker-entrypoint-initdb.d/zz_002_attendance.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 2. API เชื่อมต่อ PostGIS และเสิร์ฟหน้าเว็บใน origin เดียวกัน
  geofence-api:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres-postgis
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-cams_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cams_1234}
      DB_NAME: ${POSTGRES_DB:-cams_db}
      REDIS_URL: redis://redis-cache:6379
      RP_ID: ${RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3000}
      STUDENT_EMAIL_DOMAIN: ${STUDENT_EMAIL_DOMAIN:-cdti.ac.th}
      OTP_PEPPER: ${OTP_PEPPER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres-postgis:
        condition: service_healthy
      redis-cache:
        condition: service_started
    ports:
      - "3000:3000"

  # 3. ระบบแคชความเร็วสูง (Redis สำหรับ Dynamic QR & Session)
  redis-cache:
    image: redis:7-alpine
    container_name: cams_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
