# Render Blueprint: Geofence API (Node.js + Express) built from Backend/Dockerfile.
# The PostGIS database is hosted separately (e.g. Neon); set DATABASE_URL in the
# Render dashboard when the Blueprint asks for it.
services:
  - type: web
    name: cams-geofence-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
